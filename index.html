<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GameFace Screenshot Tournament</title>
<link rel="icon" href="https://uploadkon.ir/uploads/940c27_26IMG-20260928-001502-253.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#0B0E14;
  --surface:#131826;
  --surface-2:#1B2233;
  --surface-3:#242D42;
  --border:#2A3448;
  --text:#EDEFF5;
  --text-dim:#9AA4BD;
  --text-faint:#616D89;
  --amber:#F5A623;
  --amber-dim:#3A2C11;
  --crimson:#E9445A;
  --teal:#2FD9C4;
  --green:#3FCB78;
  --red:#EF5350;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#F0F1F6;
  --surface-3:#E7E9F0;
  --border:#DEE1EA;
  --text:#161A24;
  --text-dim:#565F76;
  --text-faint:#8991A6;
  --amber:#C97A0D;
  --amber-dim:#FBE6C4;
  --crimson:#D42E45;
  --teal:#128072;
  --green:#1E9E56;
  --red:#D2352B;
  --shadow:0 10px 30px rgba(20,24,40,.10);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Vazirmatn',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  transition:background .25s,color .25s;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
.brand-font{font-family:'Orbitron','Vazirmatn',sans-serif;}
::selection{background:var(--amber);color:#111;}

/* Scrollbar subtle */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

/* ============ Layout shells ============ */
#app{min-height:100%;padding-bottom:calc(var(--nav-h) + 24px + var(--safe-b));}
.container{max-width:760px;margin:0 auto;padding:0 18px;}
.page{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.page{animation:none;}}

/* ============ Header ============ */
header.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.top-inner{display:flex;align-items:center;gap:10px;padding:10px 18px;max-width:760px;margin:0 auto;}
.top-logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.top-logo img{width:34px;height:34px;border-radius:9px;object-fit:cover;border:1px solid var(--border);}
.top-title{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-title small{display:block;font-size:10.5px;color:var(--text-faint);font-weight:500;}
.theme-toggle{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;flex-shrink:0;
}
.admin-link{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}

.login-link{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--amber);background:var(--amber-dim);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap;font-family:inherit;}
.notice-bar{border-bottom:1px solid var(--border);background:var(--amber-dim);color:var(--amber);font-size:11.5px;font-weight:500;line-height:1.75;padding:6px 16px;text-align:center;}

/* ============ Bottom nav ============ */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex;
}
nav.bottom a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-faint);font-size:11px;font-weight:600;
}
nav.bottom a.active{color:var(--amber);}
nav.bottom .ic{font-size:19px;line-height:1;}

/* ============ Generic components ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;}
.section-title{font-size:13px;font-weight:700;color:var(--text-dim);margin:26px 0 10px;letter-spacing:.2px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-s);padding:14px 18px;font-size:15px;font-weight:700;
  cursor:pointer;width:100%;transition:transform .12s, opacity .12s, filter .12s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--amber);color:#1A1200;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-crimson{background:var(--crimson);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-green{background:var(--green);color:#06230F;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:7px;}
.field input[type=text],.field input[type=password],.field input[type=file],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-s);
  padding:13px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);}
.password-wrap{position:relative;display:flex;align-items:center;}
.password-wrap input{width:100%;padding-left:48px !important;}
.password-wrap input:-webkit-autofill,.password-wrap input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);caret-color:var(--text);box-shadow:0 0 0 1000px var(--surface-2) inset;transition:background-color 9999s ease-out 0s;}
.password-toggle{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;border-radius:9px;
  background:transparent;color:var(--text-faint);cursor:pointer;font-size:16px;
}
.password-toggle:hover{background:var(--surface-3);color:var(--text);}
.internal-back{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin:24px 0 8px;padding:12px 16px;
  border:1px solid var(--border);border-radius:12px;
  background:var(--surface-2);color:var(--text-dim);
  font-size:13.5px;font-weight:700;cursor:pointer;
}
.internal-back:hover{border-color:var(--amber);color:var(--amber);}
.rules-link{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:11px 14px;margin-top:10px;
  border:1px solid var(--border);border-radius:10px;
  background:transparent;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;
}

.hint{font-size:12px;color:var(--text-faint);margin-top:6px;}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:13px 14px;}
.checkbox-row input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--amber);}
.checkbox-row span{font-size:13.5px;color:var(--text-dim);line-height:1.7;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;}
.badge-pending{background:var(--amber-dim);color:var(--amber);}
.badge-approved{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green);}
.badge-rejected{background:color-mix(in srgb, var(--red) 18%, transparent);color:var(--red);}
.badge-winner{background:linear-gradient(90deg,var(--amber),#ffcf6b);color:#1A1200;}

.toast-wrap{position:fixed;top:calc(14px + var(--safe-t));left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:toastIn .25s ease;}
.toast.err{border-color:var(--red);color:var(--red);}
.toast.ok{border-color:var(--green);color:var(--green);}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:20px;animation:modalUp .25s ease;}
@media(min-width:640px){.modal{border-radius:20px;}}
@keyframes modalUp{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
.full-image-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;cursor:zoom-out;}
.full-image-bg img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 15px 50px rgba(0,0,0,.5);}
.chat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:90px;}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:16px;line-height:1.75;font-size:13.5px;word-break:break-word;}
.chat-bubble.user{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);}
.chat-bubble.admin{align-self:flex-end;background:var(--amber-dim);border:1px solid color-mix(in srgb,var(--amber) 45%,var(--border));}
.chat-meta{font-size:10px;color:var(--text-faint);margin-top:4px;}
.chat-compose{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px;box-shadow:var(--shadow);}
.chat-compose-row{display:flex;gap:8px;align-items:flex-end;}
.chat-compose textarea{flex:1;resize:none;min-height:44px;max-height:120px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-family:inherit;}
.chat-image{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-top:6px;cursor:pointer;}

.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-close{width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:none;color:var(--text-dim);font-size:16px;cursor:pointer;}

.spinner{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:currentColor;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ Loading screen ============ */
#loading-screen{
  position:fixed;inset:0;background:var(--bg);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading-screen img{width:76px;height:76px;border-radius:20px;object-fit:cover;box-shadow:0 0 40px rgba(245,166,35,.25);}
#loading-screen .lw{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;}
#loading-screen .ld{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--amber);animation:spin .8s linear infinite;}
.fade-out{opacity:0;pointer-events:none;transition:opacity .35s;}

/* ============ Home ============ */
.hero{text-align:center;padding:34px 0 8px;}
.hero img.logo{width:84px;height:84px;border-radius:22px;margin:0 auto 16px;object-fit:cover;border:1px solid var(--border);}
.hero h1{font-family:'Orbitron',sans-serif;font-size:26px;margin:0 0 6px;letter-spacing:1px;}
.hero p{color:var(--text-dim);font-size:14.5px;margin:0 0 22px;line-height:1.8;}

.countdown{display:flex;gap:8px;justify-content:center;margin-bottom:26px;}
.countdown .c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 6px;min-width:62px;text-align:center;}
.countdown .c b{display:block;font-family:'Orbitron',sans-serif;font-size:19px;}
.countdown .c span{font-size:10px;color:var(--text-faint);}

.action-grid{display:flex;flex-direction:column;gap:12px;}
.action-card{
  display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-m);padding:16px;cursor:pointer;text-align:right;
}
.action-card .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.action-card .tx b{display:block;font-size:15.5px;margin-bottom:2px;}
.action-card .tx span{font-size:12.5px;color:var(--text-dim);}
.action-card .arrow{margin-inline-start:auto;color:var(--text-faint);}

.status-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
.status-pill{font-size:11.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);}
.status-pill b{color:var(--text);}

/* ============ Steps ============ */
.stepper{display:flex;align-items:center;gap:6px;margin:18px 0 22px;}
.stepper .dot{flex:1;height:4px;border-radius:99px;background:var(--surface-3);}
.stepper .dot.done{background:var(--amber);}

/* ============ Series pick ============ */
.series-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.series-pick{
  border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-s);
  padding:14px 10px;text-align:center;cursor:pointer;font-weight:700;font-size:13.5px;
}
.series-pick.sel{border-color:var(--amber);background:var(--amber-dim);color:var(--amber);}

/* ============ Upload ============ */
.drop{
  border:2px dashed var(--border);border-radius:var(--radius-m);padding:30px 16px;text-align:center;cursor:pointer;
  color:var(--text-dim);background:var(--surface);
}
.drop b{color:var(--text);}
.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.preview-box img{width:100%;max-height:300px;object-fit:contain;background:#000;}
.preview-meta{display:flex;gap:14px;padding:12px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);border-top:1px solid var(--border);}
.progress-bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar i{display:block;height:100%;background:var(--amber);width:0%;transition:width .2s;}

/* ============ Gallery / cards ============ */
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:420px){.gallery{grid-template-columns:1fr;}}

/* ============ Registration series select ============ */
.series-select-wrap{position:relative;}
.series-select{
  width:100%;appearance:none;-webkit-appearance:none;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-s);
  padding:14px 42px 14px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.series-select:focus{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 14%,transparent);}
.series-select-wrap::after{content:'⌄';position:absolute;left:14px;top:50%;transform:translateY(-55%);color:var(--amber);font-size:18px;pointer-events:none;}
.series-selected{margin-top:8px;padding:9px 12px;border-radius:var(--radius-s);background:var(--amber-dim);color:var(--amber);font-size:12.5px;font-weight:700;}

/* ============ Empty state ============ */
.empty{text-align:center;padding:40px 16px;color:var(--text-faint);}
.empty .ic{font-size:34px;margin-bottom:10px;}

/* ============ Admin ============ */
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
.admin-tabs::-webkit-scrollbar{display:none;}
.admin-tab{flex-shrink:0;padding:9px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.admin-tab.active{background:var(--amber);color:#1A1200;border-color:var(--amber);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;}
.stat-card b{display:block;font-family:'Orbitron',sans-serif;font-size:22px;margin-bottom:3px;}
.stat-card span{font-size:12px;color:var(--text-dim);}
.searchbar{position:relative;margin-bottom:12px;}
.searchbar input{width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:12px 14px;font-size:14px;color:var(--text);outline:none;}
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;}
.filter-chip{flex-shrink:0;padding:7px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;}
.filter-chip.active{background:var(--surface-3);color:var(--text);border-color:var(--text-faint);}
.list-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:13px 14px;margin-bottom:9px;}
.list-row .lr-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
.list-row .lr-title{font-weight:700;font-size:14px;}
.list-row .lr-sub{font-size:12px;color:var(--text-faint);line-height:1.8;}
.list-row .lr-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;}
.toggle-row .tt b{display:block;font-size:14px;margin-bottom:2px;}
.toggle-row .tt span{font-size:11.5px;color:var(--text-faint);}
.switch{width:46px;height:26px;border-radius:99px;background:var(--surface-3);position:relative;cursor:pointer;flex-shrink:0;border:1px solid var(--border);}
.switch.on{background:var(--green);}
.switch i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;}
.switch.on i{transform:translateX(-20px);}
.lock-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px;}
.lock-screen .ic{font-size:40px;}
.lock-screen input{width:100%;max-width:260px;text-align:center;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-s);padding:13px;font-size:16px;color:var(--text);letter-spacing:3px;}

/* misc */
.row{display:flex;gap:10px;}
.grow{flex:1;}
.mt{margin-top:14px;}
.center{text-align:center;}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);font-size:12px;}
.link-btn{color:var(--teal);font-weight:700;cursor:pointer;font-size:13.5px;}
.divider{height:1px;background:var(--border);margin:18px 0;}
</style>
</head>
<body>

<div id="loading-screen">
  <img src="https://uploadkon.ir/uploads/940c27_26IMG-20260928-001502-253.jpg" alt="GameFace">
  <div class="lw">GameFace</div>
  <div class="ld"></div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>
<div id="modal-root"></div>

<header class="top">
  <div class="top-inner">
    <div class="top-logo" onclick="go('home')" style="cursor:pointer">
      <img src="https://uploadkon.ir/uploads/940c27_26IMG-20260928-001502-253.jpg" alt="logo">
      <div class="top-title">GameFace<small>Screenshot Tournament</small></div>
    </div>
    <button class="login-link" id="top-login" onclick="go('login')">ورود</button>
    <button class="admin-link" onclick="go('admin')" title="پنل مدیریت">🛠</button>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

class ApiError extends Error{
  constructor(message, code, status){ super(message); this.code = code || 'ERROR'; this.status = status || 0; }
}
const ERROR_TEXT = {
  NETWORK_ERROR:'ارتباط با سرور برقرار نشد؛ اینترنت خود را بررسی کنید و دوباره تلاش کنید.',
  TIMEOUT:'پاسخ سرور بیش از حد طول کشید؛ دوباره تلاش کنید.',
  JSONBIN_ERROR:'پایگاه داده در دسترس نیست؛ کمی بعد دوباره تلاش کنید.',
  PICRD_ERROR:'سرویس آپلود تصویر در دسترس نیست؛ کمی بعد دوباره تلاش کنید.',
  INVALID_PASSWORD:'رمز عبور صحیح نیست.',
  USER_NOT_FOUND:'حسابی با این آیدی روبیکا پیدا نشد.',
  SESSION_EXPIRED:'نشست شما منقضی شده است؛ دوباره وارد شوید.',
  UNAUTHORIZED:'برای ادامه باید وارد شوید.'
};
function isAuthError(e){ return !!e && (e.status===401 || e.status===403 || ['UNAUTHORIZED','SESSION_EXPIRED','FORBIDDEN','ACCOUNT_SUSPENDED'].includes(e.code)); }
function isCaptchaError(e){ return !!e && String(e.code||'').startsWith('CAPTCHA_'); }
async function apiFetch(path, options={}){
  const {admin, timeout, ...fetchOpts} = options;
  const headers = new Headers(fetchOpts.headers || {});
  const isForm = fetchOpts.body instanceof FormData;
  if(fetchOpts.body && !isForm && !headers.has('Content-Type')) headers.set('Content-Type','application/json');
  const token = admin ? LS.get('gf_admin_token','') : authToken;
  if(token) headers.set('Authorization','Bearer '+token);
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeout || (isForm ? 90000 : 30000));
  let res;
  try{
    res = await fetch(CONFIG.API_BASE + path, {...fetchOpts, headers, signal: ctrl.signal});
  }catch(e){
    clearTimeout(timer);
    const aborted = e && e.name==='AbortError';
    throw new ApiError(aborted ? ERROR_TEXT.TIMEOUT : ERROR_TEXT.NETWORK_ERROR, aborted ? 'TIMEOUT' : 'NETWORK_ERROR', 0);
  }
  clearTimeout(timer);
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(!res.ok || !body || body.ok===false){
    const code = (body && body.error) || ('HTTP_'+res.status);
    throw new ApiError((body && body.message) || ERROR_TEXT[code] || ('خطای سرور ('+res.status+')'), code, res.status);
  }
  if(path==='/api/auth/me' && !admin) setDone(!!body.submission);
  return body;
}

/* =========================================================
   ROUTER
========================================================= */
const routes = {};
function route(name, fn){ routes[name]=fn; }
let currentRoute = 'home';
let routeParam = null;
let routeStack = [];

function go(name, param){
  if(name !== currentRoute){
    routeStack.push({name:currentRoute,param:routeParam});
    if(routeStack.length > 20) routeStack.shift();
  }
  currentRoute = name; routeParam = param;
  location.hash = '#/'+name+(param? '/'+encodeURIComponent(param):'');
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function goBackInternal(){
  const previous = routeStack.pop();
  if(previous && previous.name){
    currentRoute = previous.name;
    routeParam = previous.param || null;
    const hash = '#/'+currentRoute+(routeParam? '/'+encodeURIComponent(routeParam):'');
    if(location.hash !== hash) history.replaceState(null,'',hash);
    render();
    window.scrollTo({top:0,behavior:'instant'});
    return;
  }
  currentRoute = 'home';
  routeParam = null;
  if(location.hash !== '#/home') history.replaceState(null,'','#/home');
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

// Like go() but replaces the current history step (used for automatic redirects, so "back" never loops).
function redirect(name, param){
  currentRoute = name; routeParam = param;
  const hash = '#/'+name+(param? '/'+encodeURIComponent(param):'');
  if(location.hash !== hash) history.replaceState(null,'',hash);
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function internalBackHtml(){
  if(currentRoute === 'home') return '';
  return `<button class="internal-back" type="button" onclick="goBackInternal()">‹&nbsp; برگشت</button>`;
}
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { name: parts[0]||'home', param: parts[1]? decodeURIComponent(parts[1]) : null };
}
window.addEventListener('hashchange', ()=>{
  const {name,param} = parseHash();
  // go() already rendered this route; rendering again made every navigation flash twice.
  if(name === currentRoute && (param||null) === (routeParam||null)) return;
  currentRoute = name; routeParam = param;
  render();
});
function updateNavActive(){
  document.querySelectorAll('nav.bottom a').forEach(a=>{
    a.classList.toggle('active', a.dataset.r === currentRoute);
  });
}
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  updateNavActive();
  updateTopBar();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="container page center" style="padding-top:60px;"><div class="spinner" style="margin:0 auto;color:var(--amber)"></div></div>`;
  try{
    const fn = routes[currentRoute] || routes['home'];
    const html = await fn(routeParam);
    if(seq !== renderSeq) return; // a newer render took over; never overwrite it with stale content
    app.innerHTML = `<div class="container page">${html}${internalBackHtml()}</div>`;
    mountHandlers();
  }catch(e){
    console.error(e);
    if(seq !== renderSeq) return;
    app.innerHTML = `<div class="container page">
      <div class="empty"><div class="ic">⚠️</div>
      <div>${esc(e instanceof ApiError ? e.message : 'مشکلی در دریافت اطلاعات پیش آمد.')}</div>
      <button class="btn btn-outline mt" style="width:auto;padding:10px 18px" onclick="render()">تلاش دوباره</button>
      </div></div>`;
  }
}

/* =========================================================
   COUNTDOWN
========================================================= */
function getDeadline(data){
  return new Date((data && data.settings && data.settings.votingDeadline) || CONFIG.VOTING_DEADLINE_ISO);
}
function countdownParts(deadline){
  const diff = deadline.getTime() - Date.now();
  const clamped = Math.max(diff,0);
  const d = Math.floor(clamped/86400000);
  const h = Math.floor(clamped%86400000/3600000);
  const m = Math.floor(clamped%3600000/60000);
  const s = Math.floor(clamped%60000/1000);
  return {d,h,m,s,ended: diff<=0};
}
function countdownHtml(deadline, id){
  const p = countdownParts(deadline);
  return `<div class="countdown ltr" id="${id}">
    <div class="c"><b>${p.d}</b><span>روز</span></div>
    <div class="c"><b>${String(p.h).padStart(2,'0')}</b><span>ساعت</span></div>
    <div class="c"><b>${String(p.m).padStart(2,'0')}</b><span>دقیقه</span></div>
    <div class="c"><b>${String(p.s).padStart(2,'0')}</b><span>ثانیه</span></div>
  </div>`;
}
let countdownTimer = null;
function startCountdownTicker(deadline, id){
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    const el = document.getElementById(id);
    if(!el){ clearInterval(countdownTimer); return; }
    const p = countdownParts(deadline);
    const vals = [String(p.d), String(p.h).padStart(2,'0'), String(p.m).padStart(2,'0'), String(p.s).padStart(2,'0')];
    // Update only the digits that changed; never rebuild the boxes (that repainted the block every second).
    el.querySelectorAll('.c b').forEach((b,i)=>{ if(b.textContent !== vals[i]) b.textContent = vals[i]; });
  },1000);
}

async function submitJoin(){
  if(authBusy) return;
  const nick=document.getElementById('f-nick')?.value.trim(), rubika=document.getElementById('f-rubika')?.value.trim(), pass=document.getElementById('f-password')?.value||'', pass2=document.getElementById('f-password2')?.value||'', answer=document.getElementById('join-captcha-answer')?.value.trim()||'', agreed=!!document.getElementById('f-agree')?.checked;
  if(!nick||!rubika||!pass||!pass2){toast('همه فیلدها را کامل کنید.','err');return;}
  const rubikaErr=rubikaClientError(rubika);
  if(rubikaErr){toast(rubikaErr,'err');return;}
  if(pass.length<6){toast('رمز عبور باید حداقل ۶ کاراکتر باشد.','err');return;}
  if(pass!==pass2){toast('تکرار رمز عبور صحیح نیست.','err');return;}
  if(!joinDraft.teamId){toast('یک سری بازی انتخاب کنید.','err');return;}
  if(!answer){toast('کد امنیتی را وارد کنید.','err');return;}
  if(!agreed){toast('برای ادامه باید قوانین را بپذیرید.','err');return;}
  if(captchaStale('register')){ try{ await loadCaptcha('register'); updateCaptchaBox(); }catch(e){} toast('کد امنیتی منقضی شده بود؛ کد جدید را وارد کنید.','err'); return; }
  authBusy=true;
  const btn=document.getElementById('join-continue'); if(btn){btn.disabled=true; btn.textContent='در حال ثبت‌نام…';}
  try{
    const r=await apiFetch('/api/auth/register',{method:'POST',body:JSON.stringify({nickname:nick,rubikaId:cleanRubikaInput(rubika),password:pass,teamId:joinDraft.teamId,agreed,captchaId:captchaState.id,captchaAnswer:answer})});
    startUserSession(r);
    joinDraft={ nickname:'', rubikaId:'', teamId:'', agreed:false };
    toast('حساب شما ساخته شد؛ برای تکمیل شرکت در مسابقه، شات خود را ارسال کنید.','ok');
    redirect('upload');
  }catch(e){
    // The error text now says exactly what failed (captcha, duplicate id, network, database ...).
    toast(e.message||'ثبت‌نام انجام نشد.','err');
    if(isCaptchaError(e)){ await refreshCaptcha(); }
  }finally{
    authBusy=false;
    const b2=document.getElementById('join-continue'); if(b2){b2.disabled=false; b2.textContent='ثبت‌نام و ادامه';}
  }
}

function onFilePicked(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;

  // Release the previous local preview URL before replacing it.
  if(uploadState.previewUrl){
    URL.revokeObjectURL(uploadState.previewUrl);
    uploadState.previewUrl = null;
  }
  uploadState.file = null;
  uploadState.uploading = false;

  const allowed = CONFIG.ALLOWED_TYPES;
  if(!allowed.includes(file.type)){
    ev.target.value = '';
    document.getElementById('preview-zone').innerHTML = '';
    toast('فرمت این تصویر پشتیبانی نمی‌شود.','err');
    return;
  }
  if(file.size > CONFIG.MAX_IMAGE_MB*1024*1024){
    ev.target.value = '';
    document.getElementById('preview-zone').innerHTML = '';
    toast('حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد.','err');
    return;
  }

  uploadState.file = file;
  uploadState.previewUrl = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>renderPreview(img.naturalWidth, img.naturalHeight);
  img.onerror = ()=>{
    URL.revokeObjectURL(uploadState.previewUrl);
    uploadState.previewUrl = null;
    uploadState.file = null;
    ev.target.value = '';
    document.getElementById('preview-zone').innerHTML = '';
    toast('تصویر انتخاب‌شده قابل خواندن نیست.','err');
  };
  img.src = uploadState.previewUrl;
}
function renderPreview(w,h){
  const zone = document.getElementById('preview-zone');
  zone.innerHTML = `
    <div class="preview-box mt">
      <img src="${uploadState.previewUrl}">
      <div class="preview-meta">
        <span>📁 ${esc(uploadState.file.name)}</span>
        <span>💾 ${fmtBytes(uploadState.file.size)}</span>
        <span>🖼️ ${w}×${h}</span>
        <span>🏷️ ${uploadState.file.type.split('/')[1].toUpperCase()}</span>
      </div>
    </div>
    <div id="upload-progress"></div>


    <div class="hint" style="margin-top:10px;line-height:1.9;text-align:center">
  ⏳ اگر آپلود کمی طول کشید، نگران نباشید و صبر کنید.
  <br>
  🔄 در صورت ناموفق بودن، ۲ تا ۳ بار دوباره تلاش کنید؛ معمولاً آپلود انجام می‌شود.
  <br>
  💬 اگر بعد از چند تلاش همچنان ارسال نشد، از بخش «چت با ادمین» با ادمین در ارتباط باشید.
</div>

    <button class="btn btn-primary mt" id="upload-btn">ارسال Screenshot</button>
    <button class="btn btn-outline mt" id="reselect-btn">انتخاب فایل دیگر</button>
  `;
  document.getElementById('upload-btn').addEventListener('click', doUpload);
  document.getElementById('reselect-btn').addEventListener('click', ()=>document.getElementById('file-input').click());
  const details = document.getElementById('submission-details');
  if(details) details.style.display = 'block';
}
async function doUpload(){
  if(uploadState.uploading) return;
  if(!authToken){toast('ابتدا وارد حساب شوید.','err');go('login');return;}
  const platformEl=document.getElementById('shot-platform'), descriptionEl=document.getElementById('shot-description');
  const platform=platformEl?.value.trim()||'', description=descriptionEl?.value.trim()||'';
  if(!platform){toast('لطفاً پلتفرم بازی را انتخاب کنید.','err');return;}
  const file=uploadState.file;
  if(!(file instanceof File)){toast('ابتدا یک تصویر معتبر انتخاب کنید.','err');return;}
  if(!CONFIG.ALLOWED_TYPES.includes(file.type)){toast('فرمت این تصویر پشتیبانی نمی‌شود.','err');return;}
  if(file.size>CONFIG.MAX_IMAGE_MB*1024*1024){toast('حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد.','err');return;}
  uploadState.uploading=true; const btn=document.getElementById('upload-btn'); if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner"></div> در حال آپلود…';}
  try{
    const fd=new FormData(); fd.append('file',file); fd.append('platform',platform); fd.append('description',description);
    const j=await apiFetch('/api/upload',{method:'POST',body:fd});
    setDone(true);
    uploadState.uploading=false;
    if(uploadState.previewUrl){ URL.revokeObjectURL(uploadState.previewUrl); }
    uploadState={ file:null, previewUrl:null, uploading:false, platform:"", description:"" };
    go('success',j.shotId);
  }catch(e){
    uploadState.uploading=false;
    if(btn){btn.disabled=false;btn.textContent='ارسال Screenshot';}
    toast(e.message||'ارسال اسکرین‌شات انجام نشد.','err');
    if(e.code==='ALREADY_SUBMITTED'){ go('profile'); }
    else if(isAuthError(e) && e.code!=='SUBMISSION_CLOSED'){ clearUserSession(); go('login'); }
  }
}

  try{ toast('در حال آپلود عکس…','ok'); const up=await uploadToPicrd(file); await apiFetch('/api/chat/send',{method:'POST',body:JSON.stringify({type:'image',imageUrl:up.imageUrl,imageToken:up.imageToken})}); go('chat'); }catch(e){toast(e.message||'ارسال عکس انجام نشد.','err'); if(isAuthError(e)){ clearUserSession(); go('login'); }}

  if(tab==='chats') return adminChats(data);

let searchDebounce=null;

  adminFilters.q = v;

function adminSubmissions(data){
  let list = Array.isArray(data?.submissions) ? data.submissions.slice() : [];
  if(adminFilters.status!=='all') list=list.filter(s=>s?.status===adminFilters.status);
  if(adminFilters.series!=='all') list=list.filter(s=>s?.game?.series===adminFilters.series);
  const q=String(adminFilters.q||'').toLowerCase();
  if(q){
    list=list.filter(s=>{
      const nick=String(s?.participant?.nickname||'').toLowerCase();
      const rubika=String(s?.participant?.rubikaId||'').toLowerCase();
      const shotId=String(s?.shotId||'').toLowerCase();
      return nick.includes(q)||rubika.includes(q)||shotId.includes(q);
    });
  }
  const teams=[...REGISTRATION_SERIES,...(Array.isArray(data?.teams)?data.teams:[]).filter(t=>!REGISTRATION_SERIES.some(s=>s.teamId===t?.teamId))];

/* ---- Admin: download the ORIGINAL screenshot (served untouched by the backend) ---- */
let downloadBusy = false;
async function downloadShot(shotId){
  if(downloadBusy) return;
  downloadBusy = true;
  try{
    toast('در حال آماده‌سازی فایل اصلی…','ok');
    const token = LS.get('gf_admin_token','');
    const res = await fetch(CONFIG.API_BASE+'/api/admin/download?shotId='+encodeURIComponent(shotId), {headers:{Authorization:'Bearer '+token}});
    if(!res.ok){
      let msg = 'دانلود انجام نشد.';
      try{ const j = await res.json(); msg = j.message || msg; }catch(e){}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const ext = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[(res.headers.get('Content-Type')||'').split(';')[0].trim()] || 'jpg';
    let name = shotId+'.'+ext;
    const m = (res.headers.get('Content-Disposition')||'').match(/filename="?([^";]+)"?/i);
    if(m) name = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast(e.message||'دانلود انجام نشد.','err'); }
  finally{ downloadBusy = false; }
}

/* ---- Admin: start a conversation with any participant ---- */
function openAdminNewChat(participantId){
  const data = dataCache || {};

    <div class="modal-head"><h3>شروع گفتگو با ${esc(p.nickname||'کاربر')}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

    <textarea id="admin-new-chat-text" rows="4" maxlength="1000" placeholder="پیام ادمین…" style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-family:inherit"></textarea>

    const shots = data.submissions.filter(s=>s?.status==='approved' && s?.game?.series===t.teamId).length;
    return `<div class="list-row"><div class="lr-top"><span class="lr-title">${esc(t.name)}</span></div><div class="lr-sub">${shots} اسکرین‌شات تأییدشده</div></div>`;
